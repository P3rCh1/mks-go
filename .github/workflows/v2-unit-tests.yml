name: Unit Tests v2
on:
  push:
    branches:
      - master
  pull_request:

jobs:
  unit-test:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.25.9'

      - name: Set up mockery
        uses: brokeyourbike/go-mockery-action@v0.2.2
        with:
          mockery-version: '2.53.6'

      - name: Check mockery relevance
        run: cd pkg/v2 && sh -c "'./scripts/check_mockery.sh'"

      - name: Run test
        run: cd pkg/v2 && make unittest
